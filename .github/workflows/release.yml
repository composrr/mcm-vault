name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
          - platform: windows-latest
            args: ''
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history + tags so the release-notes step can diff against the
          # previous tag.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install npm dependencies
        run: npm ci

      # Build the "What's new" list from the commits since the previous tag, so
      # each release shows its own changes instead of boilerplate.
      - name: Generate release notes
        id: notes
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          PREV=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || echo "")
          if [ -n "$PREV" ]; then RANGE="$PREV..$TAG"; else RANGE="$TAG"; fi
          # Drop the "v0.0.0:" prefix we put on release commits, skip merges,
          # and de-duplicate while preserving order.
          CHANGES=$(git log $RANGE --no-merges --pretty=format:'%s' \
            | sed -E 's/^v[0-9]+\.[0-9]+\.[0-9]+:[[:space:]]*//' \
            | grep -v -E '^(Merge|Bump version|chore:)' \
            | awk 'NF && !seen[$0]++' \
            | sed 's/^/- /')
          if [ -z "$CHANGES" ]; then CHANGES="- Maintenance and stability improvements"; fi
          {
            echo "body<<NOTES_EOF"
            echo "## What's new in $TAG"
            echo ""
            echo "$CHANGES"
            echo "NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build & upload to release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'MCM Vault ${{ github.ref_name }}'
          releaseBody: |
            ${{ steps.notes.outputs.body }}

            ---

            **First install:**
            - Windows: download the `.msi` (or `-setup.exe`). Click "More info" → "Run anyway" if Windows SmartScreen warns.
            - macOS (Apple Silicon): download `aarch64.dmg`. Drag MCM Vault to Applications.
            - macOS (Intel): same flow with `x64.dmg`.

            **Subsequent updates:** open the app → Settings → "Check for app updates". The app downloads, installs, and restarts itself.
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          includeUpdaterJson: true
          updaterJsonPreferNsis: false
          args: ${{ matrix.args }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Promote release out of draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          if [[ "$TAG" == *-* ]]; then
            # Pre-release tag (e.g. v0.2.0-beta.1): publish but don't mark as Latest.
            # Stable users won't see it. Beta testers grab it manually from the Releases page.
            gh release edit "$TAG" --repo "${{ github.repository }}" --draft=false --prerelease
          else
            # Stable tag: publish and mark as Latest. Auto-updater picks it up.
            gh release edit "$TAG" --repo "${{ github.repository }}" --draft=false --latest
          fi
